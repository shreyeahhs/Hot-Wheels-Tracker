openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Hot Wheels Vault API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cars
    description: Car collection operations
  - name: auth
    description: Admin authentication
  - name: messages
    description: Contact messages
  - name: wishlist
    description: Wishlist operations
  - name: models
    description: Hot Wheels model search

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /cars:
    get:
      operationId: listCars
      tags: [cars]
      summary: List all cars with optional filtering
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: series
          in: query
          schema:
            type: string
        - name: rarity
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: ["integer", "null"]
        - name: yearMin
          in: query
          schema:
            type: ["integer", "null"]
        - name: yearMax
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of cars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Car"

    post:
      operationId: createCar
      tags: [cars]
      summary: Add a new car (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarInput"
      responses:
        "201":
          description: Car created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /cars/stats:
    get:
      operationId: getCollectionStats
      tags: [cars]
      summary: Get collection statistics
      responses:
        "200":
          description: Collection statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionStats"

  /cars/recent:
    get:
      operationId: getRecentCars
      tags: [cars]
      summary: Get recently added cars
      parameters:
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Recently added cars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Car"

  /cars/spotlight:
    get:
      operationId: getSpotlightCar
      tags: [cars]
      summary: Get a random car for spotlight widget
      responses:
        "200":
          description: Random spotlight car
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "404":
          description: No cars found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /cars/{id}:
    get:
      operationId: getCar
      tags: [cars]
      summary: Get a single car by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Car details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "404":
          description: Car not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    patch:
      operationId: updateCar
      tags: [cars]
      summary: Update a car (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarUpdate"
      responses:
        "200":
          description: Updated car
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Car not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    delete:
      operationId: deleteCar
      tags: [cars]
      summary: Delete a car (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Car deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Car not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List contact messages (admin only)
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    post:
      operationId: createMessage
      tags: [messages]
      summary: Submit a contact message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /wishlist:
    get:
      operationId: listWishlist
      tags: [wishlist]
      summary: Get wishlist items
      responses:
        "200":
          description: Wishlist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WishlistItem"

    post:
      operationId: addToWishlist
      tags: [wishlist]
      summary: Add item to wishlist (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WishlistInput"
      responses:
        "201":
          description: Wishlist item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /wishlist/{id}:
    delete:
      operationId: removeFromWishlist
      tags: [wishlist]
      summary: Remove item from wishlist (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Item removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /models/search:
    get:
      operationId: searchModels
      tags: [models]
      summary: Fuzzy search Hot Wheels model database
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching model suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelSuggestion"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    DeleteResult:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    LoginInput:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    AuthToken:
      type: object
      properties:
        token:
          type: string
        username:
          type: string
      required:
        - token
        - username

    Car:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        year:
          type: integer
        series:
          type: string
        color:
          type: string
        imageUrl:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        rarity:
          type: string
        dateAdded:
          type: string
      required:
        - id
        - name
        - year
        - series
        - color
        - rarity
        - dateAdded

    CarInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        year:
          type: integer
        series:
          type: string
        color:
          type: string
        imageUrl:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        rarity:
          type: string
      required:
        - name
        - year
        - series
        - color
        - rarity

    CarUpdate:
      type: object
      properties:
        name:
          type: string
        year:
          type: integer
        series:
          type: string
        color:
          type: string
        imageUrl:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        rarity:
          type: string

    CollectionStats:
      type: object
      properties:
        totalCars:
          type: integer
        rareCars:
          type: integer
        superTreasureHunts:
          type: integer
        totalSeries:
          type: integer
        newestYear:
          type: ["integer", "null"]
        oldestYear:
          type: ["integer", "null"]
        byRarity:
          type: array
          items:
            $ref: "#/components/schemas/RarityCount"
        bySeries:
          type: array
          items:
            $ref: "#/components/schemas/SeriesCount"
        latestAddition:
          type: ["string", "null"]
      required:
        - totalCars
        - rareCars
        - superTreasureHunts
        - totalSeries
        - byRarity
        - bySeries

    RarityCount:
      type: object
      properties:
        rarity:
          type: string
        count:
          type: integer
      required:
        - rarity
        - count

    SeriesCount:
      type: object
      properties:
        series:
          type: string
        count:
          type: integer
      required:
        - series
        - count

    Message:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        message:
          type: string
        timestamp:
          type: string
      required:
        - id
        - name
        - email
        - message
        - timestamp

    MessageInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required:
        - name
        - email
        - message

    WishlistItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        year:
          type: ["integer", "null"]
        series:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        dateAdded:
          type: string
      required:
        - id
        - name
        - dateAdded

    WishlistInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        year:
          type: ["integer", "null"]
        series:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
      required:
        - name

    ModelSuggestion:
      type: object
      properties:
        name:
          type: string
        year:
          type: ["integer", "null"]
        series:
          type: ["string", "null"]
      required:
        - name
